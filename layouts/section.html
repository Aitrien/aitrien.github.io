{{- /* Plain section pages such as About: page head and prose. Not a catalogued entry, so no accession label. */ -}}
{{ define "main" }}
<div class="cx-container">
  <header class="cx-page-head">
    <h1>{{ .Title }}</h1>
    {{- with .Params.intro }}
    <p class="cx-lede">{{ . }}</p>
    {{- end }}
  </header>
  {{ partial "motifspec/article.html" (dict "page" . "toc" "auto") }}
</div>
{{ end }}
