{{- /* Fallback for a single page outside Work and Writing: page head and prose. */ -}}
{{ define "main" }}
<div class="cx-container">
  <header class="cx-page-head">
    <h1>{{ .Title }}</h1>
    {{- with .Summary }}
    <p class="cx-lede">{{ . | plainify }}</p>
    {{- end }}
  </header>
  {{ partial "article.html" (dict "page" . "toc" "auto") }}
</div>
{{ end }}
