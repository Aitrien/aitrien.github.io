{{ define "main" }}
<section class="intro">
  {{ .Content }}
</section>
<section>
  <h2>Recent writing</h2>
  <ul class="post-list">
    {{ range first 5 (where site.RegularPages "Section" "posts") }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a> <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time></li>
    {{ end }}
  </ul>
</section>
{{ end }}
