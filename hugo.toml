baseURL = "https://aitrien.com/"
languageCode = "en-us"
title = "Liam Marshall"
enableRobotsTXT = true
titleCaseStyle = "none"   # tag pages keep their kebab-case slug as the title (tag.md)
# Term pages (/tags/{term}/) are the static tag filter; the list of every tag (/tags/) is not needed.
disableKinds = ["taxonomy"]

[params]
  role = "Software engineer"
  description = "Liam Marshall is a software engineer who designs applications around the people moving through them. Case studies and writing on web platforms, analytics, design systems and accessibility."
  github = "https://github.com/Aitrien"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.146.0"
  # Pinned in go.mod. Upgrade with: hugo mod get github.com/aitrien/motifspec@vX.Y.Z
  [[module.imports]]
    path = "github.com/aitrien/motifspec"

[taxonomies]
  tag = "tags"

[menus]
  [[menus.main]]
    identifier = "work"
    name = "Work"
    pageRef = "/work"
    weight = 10
  [[menus.main]]
    identifier = "writing"
    name = "Writing"
    pageRef = "/writing"
    weight = 20
  [[menus.main]]
    identifier = "about"
    name = "About"
    pageRef = "/about"
    weight = 30

# Only Writing has a feed; work/_index.md and about/_index.md turn theirs off.
[outputs]
  home = ["html"]
  section = ["html", "rss"]
  term = ["html"]

[pagination]
  pagerSize = 20

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.goldmark.parser]
    # Standalone images reach render-image.html on their own, so they can become figures.
    wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.parser.attribute]
      block = true   # {file="…"} on code blocks, {caption="…"} on tables
  [markup.highlight]
    noClasses = false   # Chroma classes; colours come from MotifSpec (dist/chroma.css in codex.css)
    codeFences = true
    guessSyntax = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[sitemap]
  changeFreq = "monthly"

[minify.tdewolff.html]
  keepDocumentTags = true
  keepEndTags = true
  keepQuotes = true
