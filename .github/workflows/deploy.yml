name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Phase 4: the brand-codex release workflow sends this event.
  repository_dispatch:
    types: [brand-codex-release]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.151.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go (needed for Hugo Modules)
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install Hugo extended
        run: |
          wget -qO "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-modules-${{ hashFiles('go.sum') }}

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Hugo fetches github.com/aitrien/brand-codex at the version pinned in go.mod through the Go module proxy and
      # checks it against go.sum. Warnings fail the build, as on pull requests.
      - name: Build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          HUGO_MODULE_PROXY: https://proxy.golang.org   # fetch modules through the Go module proxy (Hugo defaults to direct git)
        run: hugo --gc --minify --panicOnWarning --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
