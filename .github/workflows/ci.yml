name: CI

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.151.0
      LYCHEE_VERSION: 0.20.1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go (needed for Hugo Modules)
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install Hugo extended
        run: |
          wget -qO "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-modules-${{ hashFiles('go.sum') }}

      - name: Audit layouts and content
        run: node scripts/audit.mjs

      - name: Build (warnings fail the build)
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          GOPROXY: https://proxy.golang.org   # modules come from the proxy only, never a direct git clone
        # On failure, the last lines of Hugo's output become annotations, so the reason shows on the pull request.
        run: |
          set -o pipefail
          if ! hugo --gc --minify --panicOnWarning 2>&1 | tee "${{ runner.temp }}/hugo.log"; then
            tail -n 15 "${{ runner.temp }}/hugo.log" | while IFS= read -r line; do echo "::error title=hugo::${line}"; done
            exit 1
          fi

      - name: Install lychee
        run: |
          curl -sSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "${{ runner.temp }}"
          "${{ runner.temp }}/lychee" --version

      - name: Check links in public/ (offline, including #fragments)
        run: |
          "${{ runner.temp }}/lychee" --offline --include-fragments --index-files index.html \
            --root-dir "$PWD/public" --no-progress 'public/**/*.html'
